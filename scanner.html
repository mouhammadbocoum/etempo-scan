<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Scan a job code</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;background:#111418;color:#fff;font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;overflow:hidden}video{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .2s}body.live video{opacity:1}.frame{position:fixed;left:50%;top:46%;width:min(68vmin,300px);aspect-ratio:1;transform:translate(-50%,-50%);border-radius:18px;box-shadow:0 0 0 200vmax rgba(10,12,15,.5);display:none}body.live .frame{display:block}.c{position:absolute;width:34px;height:34px;border:3px solid #fff}.tl{left:0;top:0;border-right:0;border-bottom:0;border-top-left-radius:18px}.tr{right:0;top:0;border-left:0;border-bottom:0;border-top-right-radius:18px}.bl{left:0;bottom:0;border-right:0;border-top:0;border-bottom-left-radius:18px}.br{right:0;bottom:0;border-left:0;border-top:0;border-bottom-right-radius:18px}.ln{position:absolute;left:10%;right:10%;height:2px;border-radius:2px;background:rgba(255,255,255,.85);box-shadow:0 0 12px rgba(255,255,255,.6);animation:sw 2.2s ease-in-out infinite}@keyframes sw{0%,100%{top:14%}50%{top:86%}}.top{position:fixed;left:0;right:0;top:0;display:flex;align-items:center;justify-content:space-between;padding:calc(12px + env(safe-area-inset-top)) 16px 12px;background:linear-gradient(rgba(10,12,15,.55),rgba(10,12,15,0))}.t{font-weight:650}.x{width:38px;height:38px;border:0;border-radius:50%;background:rgba(255,255,255,.16);color:#fff;font-size:24px;line-height:1}.bot{position:fixed;left:0;right:0;bottom:0;display:flex;flex-direction:column;align-items:center;gap:12px;padding:16px 16px calc(22px + env(safe-area-inset-bottom));background:linear-gradient(rgba(10,12,15,0),rgba(10,12,15,.7) 40%)}body:not(.live) .bot{top:0;justify-content:center;background:none}#msg{max-width:34ch;text-align:center}#msg.bad{color:#FFD7CF}.ok{position:fixed;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;gap:10px;background:#111418;font-size:17px;font-weight:650}body.done .ok{display:flex}.tick{width:56px;height:56px;border-radius:50%;background:#5E8B6B;display:flex;align-items:center;justify-content:center;font-size:28px}a.back{color:#fff;margin-top:6px}</style></head><body><video id="v" playsinline muted autoplay></video><div class="frame"><i class="c tl"></i><i class="c tr"></i><i class="c bl"></i><i class="c br"></i><i class="ln"></i></div><div class="top"><span class="t">Scan a job code</span><button class="x" id="x" aria-label="Close">×</button></div><div class="bot"><div id="msg" role="status"></div><button id="again" style="display:none;min-height:42px;padding:0 18px;border:0;border-radius:999px;background:#43628C;color:#fff;font:inherit;font-weight:650">Try again</button><label style="display:inline-flex;align-items:center;min-height:38px;padding:0 14px;border:1px solid rgba(255,255,255,.28);border-radius:999px;background:rgba(255,255,255,.12);font-size:13.5px;font-weight:600">Use a photo instead<input type="file" id="f" accept="image/*" capture="environment" style="position:absolute;width:1px;height:1px;opacity:0"></label></div><div class="ok"><div class="tick">✓</div><div id="okt"></div><div id="oks" style="font-size:14px;font-weight:500;opacity:.8"></div></div><script>var JSQR="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js",APP="",ORIGIN="";
try{APP=APP||new URLSearchParams(location.search).get("app")||""}catch(e){}
var stream=null,det=null,busy=false,cv=document.createElement("canvas"),badAt=0,done=false;
function $(i){return document.getElementById(i)}
function msg(t,b){var m=$("msg");m.textContent=t;m.className=b?"bad":""}
function load(cb){if(window.jsQR)return cb();var s=document.createElement("script");s.src=JSQR;s.onload=cb;s.onerror=cb;document.head.appendChild(s)}
function stop(){if(stream){stream.getTracks().forEach(function(t){try{t.stop()}catch(e){}});stream=null}}
function isOurs(t){t=String(t||"").trim();if(!t)return false;if(/^https?:\/\//i.test(t))return /[?&](?:wo|id|code|workorder)=/i.test(t);return t.length<=80}
function codeOf(t){var m=String(t).match(/[?&](?:wo|id|code|workorder)=([^&#\s]*)/i);if(!m)return String(t).trim();try{return decodeURIComponent(m[1].replace(/\+/g," "))}catch(e){return m[1]}}
function found(t){if(done)return;if(!isOurs(t)){if(Date.now()-badAt>2500){badAt=Date.now();msg("That QR code isn\u2019t a job code. Try the tag on the job.",true)}return}
 done=true;stop();try{navigator.vibrate&&navigator.vibrate(40)}catch(e){}
 document.body.classList.add("done");$("okt").textContent=codeOf(t);
 var back=APP?APP+(APP.indexOf("?")<0?"?":"&")+"wo="+encodeURIComponent(codeOf(t)):"";
 var sent=false;try{if(window.opener&&!window.opener.closed){window.opener.postMessage({etempo:"scan",text:String(t)},"*");sent=true}}catch(e){}
 if(sent){setTimeout(function(){window.close()},300);setTimeout(function(){if(back)location.replace(back);else $("oks").textContent="Go back to eTempo \u2014 the job is open there."},900)}
 else if(back){$("oks").textContent="Opening eTempo\u2026";location.replace(back)}
 else{$("oks").textContent="Go back to eTempo and scan again."}}
function decode(src,w,h,max,thorough,cb){if(!w||!h)return cb("");
 if(det){det.detect(src).then(function(c){if(c&&c[0]&&c[0].rawValue)return cb(c[0].rawValue);if(thorough)jq(src,w,h,max,true,cb);else cb("")}).catch(function(){det=null;jq(src,w,h,max,thorough,cb)});return}
 jq(src,w,h,max,thorough,cb)}
function jq(src,w,h,max,thorough,cb){if(!window.jsQR)return cb("");try{var k=Math.min(1,max/Math.max(w,h)),cw=Math.round(w*k),ch=Math.round(h*k);cv.width=cw;cv.height=ch;var x=cv.getContext("2d",{willReadFrequently:true});x.drawImage(src,0,0,cw,ch);var r=jsQR(x.getImageData(0,0,cw,ch).data,cw,ch,{inversionAttempts:thorough?"attemptBoth":"dontInvert"});cb(r&&r.data?r.data:"")}catch(e){cb("")}}
function loop(){if(!stream||done)return;var v=$("v");if(v.readyState>=2&&!busy){busy=true;decode(v,v.videoWidth,v.videoHeight,720,false,function(t){busy=false;if(t)found(t)})}setTimeout(loop,150)}
function start(){msg("Starting the camera\u2026");
 if("BarcodeDetector" in window){try{det=new BarcodeDetector({formats:["qr_code"]})}catch(e){det=null}}
 load(function(){});
 if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){msg("This browser can\u2019t open the camera here. Use the photo option instead.",true);return}
 navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:"environment"},width:{ideal:1280},height:{ideal:720}}}).then(function(s){stream=s;var v=$("v");v.srcObject=s;var p=v.play();if(p&&p.catch)p.catch(function(){});document.body.classList.add("live");msg("Point the camera at the QR code");loop()})
 .catch(function(e){var n=(e&&e.name)||"Error";msg(n==="NotAllowedError"?"Camera access was refused. Allow the camera for this page and tap Try again.":"The camera couldn\u2019t start ("+n+(e&&e.message?": "+e.message:"")+"). Tap Try again.",true);$("again").style.display=""})}
$("x").onclick=function(){stop();if(window.opener){window.close()}if(APP)setTimeout(function(){location.replace(APP)},150)};
$("again").onclick=function(){this.style.display="none";start()};
$("f").onchange=function(){var f=this.files&&this.files[0];this.value="";if(!f)return;msg("Reading the photo\u2026");var u=URL.createObjectURL(f),i=new Image();i.onload=function(){load(function(){decode(i,i.naturalWidth,i.naturalHeight,1600,true,function(t){URL.revokeObjectURL(u);if(t)found(t);else msg("No QR code found in that photo. Try again.",true)})})};i.src=u};
document.addEventListener("visibilitychange",function(){if(document.hidden)stop();else if(!done&&!stream)start()});
start();</script></body></html>
